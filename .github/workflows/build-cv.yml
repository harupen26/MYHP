name: Build CV

on:
  push:
    branches: [main]
    paths: ["cv/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile cv.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv

      - name: Update docs/CV.pdf
        run: |
          cp cv/cv.pdf docs/CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CV.pdf
          git diff --cached --quiet || git commit -m "Build CV.pdf from cv/cv.tex"
          git push
